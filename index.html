
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Reservation Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 700px;">
            <h1 class="text-center mb-2">Travel Reservation Form</h1>
            <p class="text-danger text-center">* denotes mandatory</p>

            <form action="./Screenshot 2026-05-30 125539.png">

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name *</label>
                    <input type="text" class="form-control" id="fullName"
                           placeholder="First Name Last Name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address *</label>
                    <input type="email" class="form-control" id="email"
                           placeholder="EMAIL_ADDRESS" required>
                </div>

                <div class="mb-3">
                    <label for="tour" class="form-label">Select Tour Package *</label>
                    <select class="form-select" id="tour" required>
                        <option value="" selected disabled>Select Option</option>
                        <option value="Maldives">Maldives</option>
                        <option value="Hawaii">Hawaii</option>
                        <option value="Goa">Goa</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="arrival" class="form-label">Arrival Date *</label>
                    <input type="date" class="form-control" id="arrival" required>
                </div>

                <div class="mb-3">
                    <label for="persons" class="form-label">Number Of Persons *</label>
                    <input type="number" class="form-control" id="persons"
                           min="1" placeholder="Number of persons" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">What Would You Want To Avail?</label>

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="boarding">
                        <label class="form-check-label" for="boarding">Boarding</label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="fooding">
                        <label class="form-check-label" for="fooding">Fooding</label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="sightseeing">
                        <label class="form-check-label" for="sightseeing">Sight Seeing</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="coupon" class="form-label">Discount Coupon Code</label>
                    <input type="text" class="form-control" id="coupon"
                           placeholder="Enter coupon code">
                </div>

                <div class="mb-3">
                    <label class="form-label">Terms & Conditions *</label>

                    <div class="form-check">
                        <input type="radio" class="form-check-input"
                               name="terms" id="agree" required>
                        <label class="form-check-label" for="agree">I agree</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" class="form-check-input"
                               name="terms" id="disagree">
                        <label class="form-check-label" for="disagree">I disagree</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Complete Reservation
                </button>

            </form>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
